<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="logo">&#128683;</span>
      <h1>Site Blocker</h1>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="sites" role="tab" aria-selected="true">Sites</button>
      <button class="tab-btn" data-tab="keywords" role="tab" aria-selected="false">Keywords</button>
      <button class="tab-btn" data-tab="settings" role="tab" aria-selected="false">Settings</button>
    </nav>

    <section id="tab-sites" class="tab-panel active">
      <form id="site-form" class="add-form">
        <input type="text" id="site-input" placeholder="example.com" autocomplete="off" />
        <button type="submit" class="add-btn">Add</button>
      </form>
      <ul id="site-list" class="entry-list"></ul>
      <p id="site-empty" class="empty-state">No blocked sites yet.</p>
    </section>

    <section id="tab-keywords" class="tab-panel">
      <form id="keyword-form" class="add-form">
        <input type="text" id="keyword-input" placeholder="e.g. porn, game, video" autocomplete="off" />
        <button type="submit" class="add-btn">Add</button>
      </form>
      <ul id="keyword-list" class="entry-list"></ul>
      <p id="keyword-empty" class="empty-state">No blocked keywords yet.</p>
    </section>

    <section id="tab-settings" class="tab-panel">
      <div class="setting-row">
        <div>
          <div class="setting-title">Dark theme</div>
          <div class="setting-desc">Switch between light and dark appearance.</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="theme-toggle" />
          <span class="slider"></span>
        </label>
      </div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
